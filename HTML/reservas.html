<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Huellitas Hotel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/reservas.css">
</head>
<body>
    <div id="navbar-general"></div>
    <main class="reservation-page">
        <section class="reservation-intro">
            <p class="eyebrow">Huellitas Hotel</p>
            <h1>Reserva un lugar especial</h1>
            <p>Completa los datos y asegura el cuidado que tu mascota merece.</p>
        </section>
        <form id="reservation-form" class="reservation-form">
            <label for="pet-name">Nombre de tu mascota</label>
            <input id="pet-name" type="text" required>
            <label for="service">Servicio</label>
            <select id="service" required>
                <option value="">Selecciona un servicio</option>
                <option>Hospedaje</option>
                <option>Paseo</option>
                <option>Aseo</option>
                <option>Spa</option>
            </select>
            <label for="reservation-date">Fecha</label>
            <input id="reservation-date" type="date" required>
            <button type="submit">Confirmar reserva</button>
            <p id="reservation-message" role="status"></p>
        </form>
    </main>
    <script src="../JS/navbar.js"></script>
    <script src="../JS/reservas.js"></script>
</body>
</html>
