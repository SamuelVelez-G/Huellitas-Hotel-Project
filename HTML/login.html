<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion | Huellitas Hotel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/login.css">
    <script src="../JS/theme.js"></script>
</head>
<body>
    <main class="auth-page">
        <a class="back-link" href="/index.html">&larr; Volver al inicio</a>
        <section class="auth-panel" aria-labelledby="auth-title">
            <div class="auth-heading">
                <span class="paw-mark">&#10084;</span>
                <p class="eyebrow">Huellitas Hotel</p>
                <h1 id="auth-title">Tu mascota ya te espera</h1>
                <p id="auth-description">Ingresa para continuar con tu reserva.</p>
            </div>
            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" id="tab-login" type="button" role="tab" aria-selected="true">Iniciar sesion</button>
                <button class="auth-tab" id="tab-register" type="button" role="tab" aria-selected="false">Registrarse</button>
            </div>
            <form id="auth-form" novalidate>
                <label id="name-label" class="hidden" for="name">Nombre</label>
                <input id="name" class="hidden" type="text" autocomplete="name" placeholder="Tu nombre">
                <label id="phone-label" class="hidden" for="phone">Numero telefonico</label>
                <input id="phone" class="hidden" type="tel" autocomplete="tel" inputmode="tel" placeholder="300 123 4567" pattern="[0-9+() -]{7,}" >
                <label for="email">Correo electronico</label>
                <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
                <label for="password">Contraseña</label>
                <div class="password-group">
                    <input id="password" type="password" autocomplete="current-password" placeholder="Minimo 6 caracteres" minlength="6" required>
                    <button type="button" id="btn-ver" class="toggle-password" aria-label="Mostrar contraseña"><i class="fas fa-eye" id="icono-ver"></i></button>
                </div>    
                <label id="confirm-password-label" class="hidden" for="confirm-password">Confirmar contraseña</label>
                <div class="password-group hidden" id="confirm-password-group"> 
                    <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="6">
                    <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>    
                <button class="submit-button" type="submit" id="submit-button">Iniciar sesion</button>
                <p class="form-message" id="form-message" role="status"></p>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/login.js"></script>
    <script src="../JS/perrito.js"></script>
</body>
</html>
