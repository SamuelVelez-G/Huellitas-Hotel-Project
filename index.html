<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./CSS/admin.css">
    <link rel="stylesheet" href="./CSS/navbar.css">
    <link rel="stylesheet" href="./CSS/footer.css">
</head>

<body>
    <div id="navbar-general"></div>
    <div class="container my-4">

        <div class="row">
            <div class="col-12 mb-4">

                <h1 class="mb-3">Panel de Administrador</h1>
                <h2>Registrar servicio</h2>

            </div>

            <div class="col-sm-6">

                <form id="formularioAdmin">
                    <div id="alertaContenedor"></div>

                    <!-- SERVICIO -->
                    <div class="mb-3">
                        <label for="servicio" class="form-label"> Servicio: </label>

                        <select class="form-select" id="servicio" name="servicio" required>

                            <option value="" disabled selected> Selecciona el servicio... </option>
                            <option value="Hospedaje">Hospedaje</option>
                            <option value="Paseo">Paseo</option>
                            <option value="Aseo">Aseo</option>
                            <option value="Alimentación">Alimentación</option>
                            <option value="Spa">Spa</option>
                        </select>
                    </div>

                    <!-- CLIENTE -->
                    <div class="mb-3">

                        <label for="cliente" class="form-label">Cliente:</label>

                        <input type="text" class="form-control" id="cliente" name="cliente"
                            placeholder="Nombre del cliente.." required>

                    </div>

                    <!-- NUMERO -->
                    <div class="mb-3">

                        <label for="numero" class="form-label"> Número de contacto:</label>

                        <input type="text" class="form-control" id="numero" name="numero" placeholder="ej: 123-456-7890"
                            required>

                    </div>

                    <!-- Correo -->
                    <div class="mb-3">

                        <label for="correo" class="form-label">Correo electrónico:</label>

                        <input type="email" class="form-control" id="correo" name="correo"
                            placeholder="ej: usuario@ejemplo.com" required>

                    </div>

                    <!-- MASCOTA -->
                    <div class="mb-3">

                        <label for="mascota" class="form-label">Nombre de la mascota:</label>
                        <input type="text" class="form-control" id="mascota" name="mascota"
                            placeholder="Nombre de la mascota.." required>

                    </div>

                    <!-- DESCRIPCION -->
                    <div class="mb-3">

                        <label for="descripcion" class="form-label">Descripción:</label>

                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                            placeholder="Describe el servicio..." required></textarea>

                    </div>

                    <!-- FECHA -->
                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha:</label>

                        <input type="date" class="form-control" id="fecha" name="fecha" required>
                    </div>

                    <!-- PRECIO -->
                    <div class="mb-3">

                        <label for="precio" class="form-label">Precio:</label>
                        <input type="number" class="form-control" id="precio" name="precio" placeholder="$000" required>

                    </div>

                    <!-- DISPONIBILIDAD -->
                    <div class="mb-3">

                        <label for="disponibilidad" class="form-label"> Disponibilidad:</label>

                        <select class="form-select" id="disponibilidad" name="disponibilidad">
                            <option value="" disabled selected> ¿Estado? </option>
                            <option value="Disponible"> Disponible </option>
                            <option value="No disponible">No disponible </option>
                        </select>

                    </div>

                    <!-- BOTONES -->
                    <button type="submit" class="btn btn-primary">
                        Agregar servicio
                    </button>

                    <button type="button" class="btn btn-primary"> <a class="nav-link active" aria-current="page"
                            href="./acercaNosotros.html"> Salir</a> </button>


                </form>

            </div>

        </div>

    </div>
    <div id="footer"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrVwcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="/JS/admin.js"></script>
    <script src="./JS/navbar.js"></script>
    <script src="./JS/footer.js"></script>
</body>

</html>
